name: Publish Engram Cloud Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to publish"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          PUSH_TAG: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
          MANUAL_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
              echo "Manual image recovery must be dispatched from main." >&2
              exit 1
            fi

            tag="$MANUAL_TAG"
            if [[ "$tag" != v* ]] || ! git check-ref-format "refs/tags/$tag"; then
              echo "Manual image tag must be a valid Git tag beginning with v." >&2
              exit 1
            fi

            repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
            auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
            tag_ref="refs/tags/$tag"
            peeled_ref="${tag_ref}^{}"
            remote_refs="$(git -c http.extraHeader="AUTHORIZATION: basic $auth_header" ls-remote --exit-code "$repo_url" "$tag_ref" "$peeled_ref")" || {
              echo "Tag $tag does not exist in the remote repository." >&2
              exit 1
            }

            tag_sha=""
            direct_sha=""
            while read -r sha ref; do
              if [[ "$ref" == "$peeled_ref" ]]; then
                tag_sha="$sha"
              elif [[ "$ref" == "$tag_ref" ]]; then
                direct_sha="$sha"
              fi
            done <<< "$remote_refs"
            tag_sha="${tag_sha:-$direct_sha}"
          else
            tag="$PUSH_TAG"
            tag_sha="$PUSH_SHA"
          fi

          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "tag_sha=$tag_sha"
            echo "short_sha=${tag_sha:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify manual release tag checkout
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REMOTE_TAG_SHA: ${{ steps.release.outputs.tag_sha }}
        run: |
          set -euo pipefail

          head_sha="$(git rev-parse HEAD)"
          local_tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$head_sha" != "$REMOTE_TAG_SHA" || "$head_sha" != "$local_tag_sha" ]]; then
            echo "Checked-out HEAD does not match tag $RELEASE_TAG." >&2
            exit 1
          fi

      - name: Detect default-branch release tag
        id: refcheck
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.tag_sha }}
        run: |
          if git branch -r --contains "$RELEASE_SHA" | grep -q "origin/main"; then
            echo "is_default_branch_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_default_branch_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/lestat998/engram
          tags: |
            type=raw,value=latest,enable=${{ steps.refcheck.outputs.is_default_branch_tag == 'true' }}
            type=ref,event=tag
            type=raw,value=${{ steps.release.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=sha-${{ steps.release.outputs.short_sha }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Engram Cloud
            org.opencontainers.image.description=Project-scoped sync and dashboard runtime for Engram Cloud.
            org.opencontainers.image.source=https://github.com/gentleman-programming/engram
            org.opencontainers.image.licenses=MIT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/cloud/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
